<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAVAGE TECH HUB - Sign In</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #0b0714;
            background-image: radial-gradient(circle at center, #1a102f 0%, #0b0714 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            margin: 5px 0;
        }
        .logo-sub {
            font-size: 9px;
            letter-spacing: 3px;
            color: #a855f7;
            text-transform: uppercase;
        }
        .auth-card {
            background: #120924;
            border: 1px solid #7b2cbf;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 32px rgba(123, 44, 191, 0.25);
        }
        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            border-bottom: 1px solid #241442;
            position: relative;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #6b7280;
            cursor: pointer;
            background: none;
            border: none;
        }
        .tab.active {
            color: #ffffff;
        }
        .tab-indicator {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 50%;
            height: 2px;
            background: #a855f7;
            transition: transform 0.3s ease;
        }
        .tab.active:nth-child(2) ~ .tab-indicator {
            transform: translateX(100%);
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        .input-field {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background: #0b0714;
            border: 1px solid #4c1d95;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .input-field:focus {
            border-color: #a855f7;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 14px;
            color: #9ca3af;
            font-size: 14px;
        }
        .forgot-pass {
            text-align: right;
            font-size: 12px;
            color: #a855f7;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7b2cbf 0%, #6b21a8 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(123, 44, 191, 0.4);
        }
        .divider {
            text-align: center;
            margin: 15px 0;
            color: #6b7280;
            font-size: 11px;
            letter-spacing: 1px;
        }
        .btn-google {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #1f2937;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .footer-text {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #9ca3af;
        }
        .footer-text span {
            color: #a855f7;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="logo-title">SAVAGE TECH HUB</div>
        <div class="logo-sub">BUILD • INNOVATE • DOMINATE</div>
    </div>

    <div class="auth-card">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" onclick="switchTab('signup')">Sign Up</button>
            <div class="tab-indicator" id="tabIndicator"></div>
        </div>

        <div class="input-group">
            <span class="input-icon">✉️</span>
            <input type="email" id="email" class="input-field" placeholder="Email">
        </div>
        
        <div class="input-group">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" class="input-field" placeholder="Password">
        </div>

        <div class="forgot-pass" onclick="alert('Password reset requested')">Forgot Password?</div>

        <button class="btn-primary" onclick="alert('Signing in...')">Sign In</button>

        <div class="divider">OR</div>

        <button id="googleLoginBtn" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.13 0 9.83 0 12s.43 3.87 1.18 5.38l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
            Continue with Google
        </button>

        <div class="footer-text">
            Don't have an account? <span onclick="switchTab('signup')">Sign Up</span>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab');
            const indicator = document.getElementById('tabIndicator');
            if(tab === 'signin') {
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
                indicator.style.transform = 'translateX(0%)';
            } else {
                tabs[1].classList.add('active');
                tabs[0].classList.remove('active');
                indicator.style.transform = 'translateX(100%)';
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AizaSyBb4Zg5oLdK-xPtbuJk9iLDQFWIk6Id5o",
            authDomain: "savagetechshub-8a855.firebaseapp.com",
            projectId: "savagetechshub-8a855",
            appId: "1:163235202899:web:80c9cfbdfd04131fcdc3a6"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const provider = new GoogleAuthProvider();

            const googleBtn = document.getElementById('googleLoginBtn');
            if (googleBtn) {
                googleBtn.addEventListener('click', async () => {
                    try {
                        await signInWithPopup(auth, provider);
                        window.location.href = '/home';
                    } catch (error) {
                        console.error("Google Sign-In Error:", error);
                        alert("Google Sign-In failed: " + error.message);
                    }
                });
            }
        } catch (e) {
            console.error("Firebase setup error:", e);
        }
    </script>
</body>
</html>
