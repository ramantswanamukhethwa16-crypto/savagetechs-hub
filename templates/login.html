<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAVAGE TECH HUB - Sign In / Sign Up</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #0b0714;
            background-image: radial-gradient(circle at center, #1a102f 0%, #0b0714 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            margin: 5px 0;
        }
        .logo-sub {
            font-size: 10px;
            letter-spacing: 3px;
            color: #a855f7;
            text-transform: uppercase;
        }
        .auth-card {
            background: #120924;
            border: 1px solid #7b2cbf;
            padding: 25px;
            border-radius: 14px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 24px rgba(123, 44, 191, 0.2);
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            color: #c084fc;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .input-field {
            width: 100%;
            padding: 12px 15px;
            background: #0b0714;
            border: 1px solid #4c1d95;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .input-field:focus {
            border-color: #a855f7;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #7b2cbf;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }
        .btn-primary:active {
            background: #6b21a8;
        }
        .divider {
            text-align: center;
            margin: 15px 0;
            color: #6b7280;
            font-size: 12px;
            position: relative;
        }
        .btn-google {
            width: 100%;
            padding: 12px;
            background: #1a102f;
            color: white;
            border: 1px solid #7b2cbf;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="logo-title">SAVAGE TECH'S HUB</div>
        <div class="logo-sub">Secure Portal</div>
    </div>

    <div class="auth-card">
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" class="input-field" placeholder="Enter your email">
        </div>
        
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" class="input-field" placeholder="Enter your password">
        </div>

        <button class="btn-primary" onclick="alert('Logging in...')">Sign In</button>

        <div class="divider">OR</div>

        <button id="googleLoginBtn" class="btn-google">
            <span>🌐</span> Continue with Google
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                window.location.href = '/home';
            } catch (error) {
                console.error("Auth error:", error);
                alert("Google Sign-In failed: " + error.message);
            }
        });
    </script>
</body>
</html>
