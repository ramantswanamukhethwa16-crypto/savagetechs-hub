<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SAVAGE TECH HUB - Sign In / Sign Up</title>
    <style>
        body {
            background-color: #0b0714;
            background-image: radial-gradient(circle at center, #1a102f 0%, #0b0714 100%);
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            margin: 5px 0;
        }
        .logo-sub {
            font-size: 10px;
            letter-spacing: 3px;
            color: #a855f7;
            text-transform: uppercase;
        }
        .auth-card {
            background: rgba(18, 9, 36, 0.85);
            border: 1px solid #7b2cbf;
            padding: 30px;
            border-radius: 16px;
            width: 330px;
            box-shadow: 0 0 25px rgba(123, 44, 191, 0.3);
        }
        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            border-bottom: 1px solid #2d1b4e;
            padding-bottom: 10px;
        }
        .tab {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding-bottom: 5px;
        }
        .tab.active {
            color: #fff;
            border-bottom: 2px solid #a855f7;
        }
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            background: #0b0714;
            border: 1px solid #4c1d95;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .input-group input:focus {
            border-color: #a855f7;
            outline: none;
        }
        .input-group span {
            position: absolute;
            left: 12px;
            top: 13px;
            color: #9ca3af;
        }
        .forgot {
            text-align: right;
            font-size: 12px;
            color: #a855f7;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .btn-main {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7b2cbf, #9d4edd);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(157, 78, 221, 0.4);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #6b7280;
            font-size: 12px;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #2d1b4e;
        }
        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }
        .btn-google {
            width: 100%;
            padding: 11px;
            background: #ffffff;
            color: #1f2937;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 20px;
        }
        .footer-text span {
            color: #a855f7;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Optional Hexagon Logo Graphic Representation -->
        <div style="font-size: 32px; color: #a855f7; margin-bottom: 5px;">⬡</div>
        <div class="logo-title">SAVAGE TECH HUB</div>
        <div class="logo-sub">BUILD • INNOVATE • DOMINATE</div>
    </div>

    <div class="auth-card">
        <div class="tabs">
            <button class="tab active" id="signinTab" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Form -->
        <div class="input-group">
            <span>✉</span>
            <input type="email" id="email" placeholder="Email">
        </div>
        <div class="input-group">
            <span>🔒</span>
            <input type="password" id="password" placeholder="Password">
        </div>

        <div class="forgot" onclick="handleForgotPassword()">Forgot Password?</div>

        <button class="btn-main" id="actionBtn" onclick="submitAuth()">Sign In</button>

        <div class="divider">OR</div>

        <button class="btn-google" onclick="handleGoogleSignIn()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.14 0 9.87 0 12s.43 3.86 1.18 5.38l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
            Continue with Google
        </button>

        <div class="footer-text" id="footerToggleText">
            Don't have an account? <span onclick="switchTab('signup')">Sign Up</span>
        </div>
    </div>

    <!-- Firebase SDK Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            sendEmailVerification, 
            signInWithPopup, 
            GoogleAuthProvider,
            sendPasswordResetEmail 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Replace with your Firebase configuration parameters
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
            projectId: "YOUR_FIREBASE_PROJECT_ID",
            storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",
            messagingSenderId: "YOUR_FIREBASE_SENDER_ID",
            appId: "YOUR_FIREBASE_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        let isSignUp = false;

        window.switchTab = function(mode) {
            isSignUp = (mode === 'signup');
            const signinTab = document.getElementById('signinTab');
            const signupTab = document.getElementById('signupTab');
            const actionBtn = document.getElementById('actionBtn');
            const footerText = document.getElementById('footerToggleText');

            if (isSignUp) {
                signupTab.classList.add('active');
                signinTab.classList.remove('active');
                actionBtn.innerText = 'Sign Up';
                footerText.innerHTML = 'Already have an account? <span onclick="switchTab(\'signin\')">Sign In</span>';
            } else {
                signinTab.classList.add('active');
                signupTab.classList.remove('active');
                actionBtn.innerText = 'Sign In';
                footerText.innerHTML = 'Don\'t have an account? <span onclick="switchTab(\'signup\')">Sign Up</span>';
            }
        }

        window.submitAuth = function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("Please fill in both email and password.");
                return;
            }

            if (isSignUp) {
                // Register and send verification email to inbox
                createUserWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        sendEmailVerification(userCredential.user)
                            .then(() => {
                                alert("Account created successfully! A verification code/link has been sent to your email inbox. Please verify before exploring.");
                                window.location.href = "/home";
                            });
                    })
                    .catch((error) => {
                        alert("Sign Up Error: " + error.message);
                    });
            } else {
                // Sign In existing user
                signInWithEmailAndPassword(auth, email, password)
                    .then(() => {
                        window.location.href = "/home";
                    })
                    .catch((error) => {
                        alert("Sign In Error: " + error.message);
                    });
            }
        }

        window.handleGoogleSignIn = function() {
            signInWithPopup(auth, googleProvider)
                .then(() => {
                    window.location.href = "/home";
                })
                .catch((error) => {
                    alert("Google Auth Error: " + error.message);
                });
        }

        window.handleForgotPassword = function() {
            const email = document.getElementById('email').value;
            if (!email) {
                alert("Please enter your email address in the email field first.");
                return;
            }
            sendPasswordResetEmail(auth, email)
                .then(() => {
                    alert("Password reset link sent to your inbox!");
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        }
    </script>
</body>
</html>
