<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAVAGE TECH HUB - Auth</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #0b0714;
            background-image: radial-gradient(circle at center, #1a102f 0%, #0b0714 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-img {
            width: 50px;
            height: 50px;
            margin-bottom: 8px;
        }
        .logo-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            margin: 0;
            text-transform: uppercase;
        }
        .logo-sub {
            font-size: 8px;
            letter-spacing: 2.5px;
            color: #a855f7;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .auth-card {
            background: #120924;
            border: 1px solid #7b2cbf;
            padding: 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(123, 44, 191, 0.25);
        }
        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 22px;
            border-bottom: 1px solid #241442;
            position: relative;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding-bottom: 10px;
            font-size: 15px;
            font-weight: bold;
            color: #6b7280;
            cursor: pointer;
            background: none;
            border: none;
        }
        .tab.active {
            color: #ffffff;
        }
        .tab-indicator {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 50%;
            height: 2px;
            background: #a855f7;
            transition: transform 0.3s ease;
        }
        .tab.active:nth-child(2) ~ .tab-indicator {
            transform: translateX(100%);
        }
        .input-group {
            margin-bottom: 16px;
            position: relative;
        }
        .input-field {
            width: 100%;
            padding: 13px 40px;
            background: #0b0714;
            border: 1px solid #4c1d95;
            color: white;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        .input-field:focus {
            border-color: #a855f7;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 14px;
            color: #9ca3af;
            font-size: 15px;
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 14px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 15px;
            background: none;
            border: none;
        }
        .forgot-pass {
            text-align: right;
            font-size: 12px;
            color: #a855f7;
            margin-bottom: 18px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-primary {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #7b2cbf 0%, #6b21a8 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 18px 0;
            color: #6b7280;
            font-size: 11px;
            letter-spacing: 1px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #241442;
        }
        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }
        .btn-google {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #1f2937;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .footer-text {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #9ca3af;
        }
        .footer-text span {
            color: #a855f7;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Optional Logo SVG / Graphic matching style -->
        <div class="logo-title">SAVAGE TECH HUB</div>
        <div class="logo-sub">BUILD • INNOVATE • DOMINATE</div>
    </div>

    <div class="auth-card">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" onclick="switchTab('signup')">Sign Up</button>
            <div class="tab-indicator" id="tabIndicator"></div>
        </div>

        <div class="input-group">
            <span class="input-icon">✉️</span>
            <input type="email" id="email" class="input-field" placeholder="Email">
        </div>
        
        <div class="input-group">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" class="input-field" placeholder="Password">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
        </div>

        <div id="forgotPassText" class="forgot-pass" onclick="handleForgotPassword()">Forgot Password?</div>

        <button id="actionBtn" class="btn-primary" onclick="handleAuthAction()">Sign In</button>

        <div class="divider">OR</div>

        <button id="googleLoginBtn" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.13 0 9.83 0 12s.43 3.87 1.18 5.38l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
            Continue with Google
        </button>

        <div class="footer-text" id="footerToggleText">
            Don't have an account? <span onclick="switchTab('signup')">Sign Up</span>
        </div>
    </div>

    <script>
        let currentMode = 'signin';

        function switchTab(tab) {
            currentMode = tab;
            const tabs = document.querySelectorAll('.tab');
            const indicator = document.getElementById('tabIndicator');
            const actionBtn = document.getElementById('actionBtn');
            const forgotPass = document.getElementById('forgotPassText');
            const footerText = document.getElementById('footerToggleText');

            if(tab === 'signin') {
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
                indicator.style.transform = 'translateX(0%)';
                actionBtn.innerText = 'Sign In';
                forgotPass.style.display = 'block';
                footerText.innerHTML = 'Don\'t have an account? <span onclick="switchTab(\'signup\')">Sign Up</span>';
            } else {
                tabs[1].classList.add('active');
                tabs[0].classList.remove('active');
                indicator.style.transform = 'translateX(100%)';
                actionBtn.innerText = 'Sign Up';
                forgotPass.style.display = 'none';
                footerText.innerHTML = 'Already have an account? <span onclick="switchTab(\'signin\')">Sign In</span>';
            }
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            if (passInput.type === 'password') {
                passInput.type = 'text';
            } else {
                passInput.type = 'password';
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            sendEmailVerification,
            sendPasswordResetEmail 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

                const firebaseConfig = {
            apiKey: "AIzaSyBb4Zxg5oLdK-xPtbuJk9iLDQFWIk6Id5o",
            authDomain: "savagetechshub-8a855.firebaseapp.com",
            projectId: "savagetechshub-8a855",
            appId: "1:163235202899:web:80c9cfbdfd04131fcdc3a6"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.handleAuthAction = async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }

            try {
                if (window.currentMode === 'signup') {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await sendEmailVerification(userCredential.user);
                    alert("Account created successfully! A verification email has been sent to " + email + ". Please check your inbox.");
                    window.location.href = '/home';
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    window.location.href = '/home';
                }
            } catch (error) {
                console.error("Auth Error:", error);
                alert("Authentication failed: " + error.message);
            }
        };

        window.handleForgotPassword = async () => {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                alert("Please enter your email address in the email field first, then click 'Forgot Password?'.");
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                alert("Password reset email sent to " + email);
            } catch (error) {
                console.error("Reset Error:", error);
                alert("Error sending reset email: " + error.message);
            }
        };

        const googleBtn = document.getElementById('googleLoginBtn');
        if (googleBtn) {
            googleBtn.addEventListener('click', async () => {
                try {
                    await signInWithPopup(auth, provider);
                    window.location.href = '/home';
                } catch (error) {
                    console.error("Google Sign-In Error:", error);
                    alert("Google Sign-In failed: " + error.message);
                }
            });
        }
    </script>
</body>
</html>
