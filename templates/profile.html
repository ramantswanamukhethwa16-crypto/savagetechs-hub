<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - SAVAGE TECH'S HUB</title>
    <style>
        body { background-color: #0b0714; color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        header { text-align: center; padding: 20px; font-weight: bold; border-bottom: 1px solid #1a102f; color: #d8b4fe; }
        .container { padding: 20px; text-align: center; }
        .profile-img { width: 90px; height: 90px; border-radius: 50%; border: 2px solid #9d4edd; object-fit: cover; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 20px 0; }
        .stat-card { background: #1a102f; padding: 12px; border-radius: 10px; border: 1px solid #7b2cbf; }
        .card { background: #1a102f; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid #7b2cbf; text-align: left; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #0b0714; border: 1px solid #9d4edd; color: white; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #9d4edd; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #120924; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #241442; }
        .nav-item { color: #9d4edd; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>
    <header>“ überall SAVAGE TECH'S HUB Everywhere ”</header>
    <div class="container">
        <img src="https://via.placeholder.com/90" alt="Profile Picture" class="profile-img" id="currentPic">
        <h3 id="usernameDisplay">SAVAGE_DEV</h3>

        <div class="stats-grid">
            <div class="stat-card"><h4>Followers</h4><p id="statFollowers">0</p></div>
            <div class="stat-card"><h4>Likes</h4><p id="statLikes">0</p></div>
            <div class="stat-card"><h4>Uploads</h4><p id="statUploads">0</p></div>
            <div class="stat-card"><h4>Downloads</h4><p id="statDownloads">0</p></div>
        </div>

        <div class="card">
            <h4>Edit Profile</h4>
            <label>Change Username:</label>
            <input type="text" id="newUsername" placeholder="Enter new username">
            <button onclick="updateUsername()">Save Username</button>

            <label style="margin-top:10px; display:block;">Change Profile Picture URL:</label>
            <input type="text" id="newPicUrl" placeholder="Paste image link">
            <button onclick="updatePic()">Update Picture</button>
        </div>
    </div>

    <div class="nav-bar">
        <a href="/home" class="nav-item">Home</a>
        <a href="/search" class="nav-item">Search</a>
        <a href="/files" class="nav-item">Files</a>
        <a href="/leaderboard" class="nav-item">Leaderboard</a>
        <a href="/profile" class="nav-item" style="color: #fff;">Profile</a>
        <a href="/settings" class="nav-item">Settings</a>
    </div>

    <script>
        function updateUsername() {
            const name = document.getElementById('newUsername').value;
            if(name) { document.getElementById('usernameDisplay').innerText = name; alert("Username updated!"); }
        }
        function updatePic() {
            const url = document.getElementById('newPicUrl').value;
            if(url) { document.getElementById('currentPic').src = url; alert("Profile picture updated!"); }
        }
    </script>
</body>
</html>
