<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Files - SAVAGE TECH'S HUB</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #0b0714;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding-bottom: 70px;
        }
        header {
            background: #120924;
            padding: 15px 20px;
            border-bottom: 1px solid #1a102f;
            font-weight: bold;
            color: #d8b4fe;
            text-align: center;
            font-size: 14px;
        }
        .container { padding: 15px; }
        .tag-row {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .tag-pill {
            background: #1a102f;
            border: 1px solid #4c1d95;
            color: #d8b4fe;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }
        .tag-pill.active {
            background: #7b2cbf;
            color: white;
        }
        .file-card {
            background: #1a102f;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #7b2cbf;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-info h4 { margin: 0 0 4px 0; font-size: 13px; color: #fff; }
        .file-info p { margin: 0; font-size: 11px; color: #9ca3af; }
        .download-btn {
            background: #7b2cbf;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #120924;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #241442;
            z-index: 100;
        }
        .nav-item {
            color: #9ca3af;
            text-decoration: none;
            font-size: 11px;
            text-align: center;
        }
        .nav-item.active {
            color: #a855f7;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>FILES PAGE</header>
    
    <div class="container">
        <div class="tag-row">
            <span class="tag-pill active">All</span>
            <span class="tag-pill">Configurations (120)</span>
            <span class="tag-pill">ModMenu (44)</span>
            <span class="tag-pill">Scripts (VIP)</span>
            <span class="tag-pill">Backups</span>
        </div>

        <div style="font-size: 12px; color: #c084fc; margin: 15px 0 8px 0;">Recent Files</div>

        <div class="file-card">
            <div class="file-info">
                <h4>Configuration_ShadowConfigv2.ovpn</h4>
                <p>Modified: 1h ago • 2.4 MB</p>
            </div>
            <button class="download-btn" onclick="alert('Downloading file...')">📥</button>
        </div>

        <div class="file-card">
            <div class="file-info">
                <h4>SAVAGE_DNS_v2.conf</h4>
                <p>Modified: 1h ago • 1.1 MB</p>
            </div>
            <button class="download-btn" onclick="alert('Downloading file...')">📥</button>
        </div>

        <div class="file-card">
            <div class="file-info">
                <h4>ModMenu Fix</h4>
                <p>Modified: 3h ago • 3.8 MB</p>
            </div>
            <button class="download-btn" onclick="alert('Downloading file...')">📥</button>
        </div>
    </div>

    <div class="nav-bar">
        <a href="/home" class="nav-item">🏠<br>Home</a>
        <a href="/search" class="nav-item">🔍<br>Search</a>
        <a href="/files" class="nav-item active">📁<br>Files</a>
        <a href="/leaderboard" class="nav-item">🏆<br>Leaderboard</a>
        <a href="/profile" class="nav-item">👤<br>Profile</a>
    </div>
</body>
</html>
