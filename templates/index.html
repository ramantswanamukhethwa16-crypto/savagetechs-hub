<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - SAVAGE TECH'S HUB</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0714; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding-bottom: 70px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #120924; border-bottom: 1px solid #1a102f; }
        .header-title { color: #d8b4fe; font-size: 14px; font-weight: bold; }
        .msg-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #c084fc; }
        .container { padding: 15px; }
        
        /* Message Popup Overlay */
        #communityOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 7, 20, 0.95);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        .overlay-content {
            background: #120924;
            border: 1px solid #7b2cbf;
            border-radius: 12px;
            padding: 20px;
            margin-top: 50px;
        }
        .close-overlay {
            background: #7b2cbf;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            float: right;
            cursor: pointer;
            font-weight: bold;
        }
        .contact-box {
            background: #1a102f;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #7b2cbf;
            margin-top: 20px;
        }
        .contact-box a { color: #c084fc; text-decoration: none; display: block; margin-top: 8px; font-size: 13px; }

        /* Bottom Nav */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #120924; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #241442; z-index: 100; }
        .nav-item { color: #9ca3af; text-decoration: none; font-size: 11px; text-align: center; }
        .nav-item.active { color: #a855f7; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div class="header-title">SAVAGE TECH'S HUB</div>
        <button class="msg-btn" onclick="openOverlay()">💬</button>
    </header>

    <div class="container">
        <h2>Welcome to Home Dashboard</h2>
    </div>

    <!-- Message Overlay Modal -->
    <div id="communityOverlay">
        <button class="close-overlay" onclick="closeOverlay()">Close ✕</button>
        <div style="clear: both;"></div>
        <div class="overlay-content">
            <h3 style="color: #d8b4fe; font-size: 14px; margin-top: 0;">JOIN HERE FOR VPN FILES/FOLLOW AND REACT</h3>
            <div class="contact-box">
                <div style="font-weight: bold; margin-bottom: 5px; font-size: 13px;">Direct Contact & Communities</div>
                <div style="font-size: 12px; color: #9ca3af;">Phone: 0734548144</div>
                <a href="https://whatsapp.com" target="_blank">🔗 Join WhatsApp Group</a>
                <a href="https://whatsapp.com" target="_blank">🔗 Join WhatsApp Channel</a>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a href="/home" class="nav-item active">🏠<br>Home</a>
        <a href="/search" class="nav-item">🔍<br>Search</a>
        <a href="/files" class="nav-item">📁<br>Files</a>
        <a href="/leaderboard" class="nav-item">🏆<br>Leaderboard</a>
        <a href="/profile" class="nav-item">👤<br>Profile</a>
        <a href="/settings" class="nav-item">⚙️<br>Settings</a>
    </div>

    <script>
        function openOverlay() { document.getElementById('communityOverlay').style.display = 'block'; }
        function closeOverlay() { document.getElementById('communityOverlay').style.display = 'none'; }
    </script>
</body>
</html>
